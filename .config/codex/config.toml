background_terminal_max_timeout = 3600000
cli_auth_credentials_store = "file"
model = "gpt-6-astra"
model_reasoning_effort = "medium"
suppress_unstable_features_warning = true
plan_mode_reasoning_effort = "xhigh"
approvals_reviewer = "auto_review"
approval_policy = "on-request"
service_tier = "default"

[features]
runtime_metrics = true
terminal_resize_reflow = true
goals = true

[agents]
max_threads = 8

[projects."/home/james/src/tesuji"]
trust_level = "trusted"

[projects."/home/james/src/tesuji_worktrees"]
trust_level = "trusted"

[projects."/home/james/src/tesuji.review"]
trust_level = "trusted"

[tui]
status_line = ["thread-title", "model-with-reasoning", "context-remaining", "used-tokens", "weekly-limit", "current-dir", "git-branch", "permissions"]
status_line_use_colors = true
terminal_title = ["activity", "project-name", "thread-title"]

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4
gpt-6-astra = 4

[notice]
fast_default_opt_out = true
hide_rate_limit_model_nudge = true

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
